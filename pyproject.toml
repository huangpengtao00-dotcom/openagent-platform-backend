[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-platform-backend"
version = "0.2.0"
description = "OpenAgent Platform Backend: FastAPI control plane, async worker/queue, evaluation history and cost metrics for a multi-model coding-agent benchmark."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools]
packages = ["app"]
